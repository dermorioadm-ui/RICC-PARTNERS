name: Fix mobile fold gap

on:
  push:
    branches:
      - fix/mobile-fold-gap-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-fold-gap-final
      - name: Remove mobile override that reopens hero gap
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('RICC Site v2.dc.html')
          s = p.read_text(encoding='utf-8')
          old = '.eligibility-scene{margin-top:0!important}'
          new = '.eligibility-scene{margin-top:calc(-1 * var(--ricc-vh,100dvh))!important}'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one mobile margin override, found {count}; refusing unrelated edits.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit isolated gap fix
        run: |
          rm .github/workflows/fix-mobile-fold-gap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "RICC Site v2.dc.html" .github/workflows/fix-mobile-fold-gap.yml
          git commit -m "fix: close mobile gap between hero and eligibility"
          git push origin HEAD:fix/mobile-fold-gap-final
