name: Final mobile production fix

on:
  push:
    branches:
      - fix/production-mobile-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-mobile-final

      - name: Apply final mobile fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('RICC Site v2.dc.html')
          s = p.read_text(encoding='utf-8')

          def one(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          # 1) Remove the dead viewport between the sticky hero and eligibility scene.
          one(
              ".eligibility-scene{position:relative;z-index:2;margin-top:0;min-height:100vh;min-height:100dvh;",
              ".eligibility-scene{position:relative;z-index:2;margin-top:calc(-1 * var(--ricc-vh,100dvh));min-height:var(--ricc-vh,100dvh);",
              'eligibility overlap'
          )

          # 2) Use the largest initial mobile viewport measurement and then freeze it.
          one(
              "const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight || 1;",
              "const h = Math.max(window.innerHeight || 0, (window.visualViewport && window.visualViewport.height) || 0, document.documentElement.clientHeight || 0) || 1;",
              'stable viewport height'
          )

          # 3) Restore founder section to the original dark RICC treatment.
          one(
              "[data-fold=\"35\"]{background:#F4F3E8 url('./img/founder-ivory.png') center/cover!important;color:#17212A!important}\n[data-fold=\"35\"] p{color:#46545F!important}\n[data-fold=\"35\"] [data-decode],[data-socio-foto]>div:last-child{color:#53616A!important}\n[data-fold=\"35\"] [style*=\"color:#9DB4F5\"]{color:#1E3FA8!important}",
              "[data-fold=\"35\"]{background:#0E1114!important;color:#F1F2EE!important}\n[data-fold=\"35\"] p{color:#C8CDD2!important}\n[data-fold=\"35\"] [data-decode],[data-socio-foto]>div:last-child{color:#84837B!important}\n[data-fold=\"35\"] [style*=\"color:#9DB4F5\"]{color:#9DB4F5!important}",
              'founder dark section'
          )

          # 4) Keep the circular SCROLL cursor under the finger across the whole mobile page.
          one(
              "let touchAt = 0;\n    const placeTouchMeter = (x, y) => {\n      if (!coarse || !meterEl) return;\n      mx = x; my = y; touchAt = Date.now();",
              "let touchAt = 0;\n    let touchActive = false;\n    const placeTouchMeter = (x, y) => {\n      if (!coarse || !meterEl) return;\n      mx = x; my = y; touchAt = Date.now(); touchActive = true;",
              'touch active setup'
          )

          one(
              "const onTouchMove = e => { const t = e.touches && e.touches[0]; if (t) placeTouchMeter(t.clientX, t.clientY); };\n    const onPointerDown = e => { if (e.pointerType === 'touch' || e.pointerType === 'pen') placeTouchMeter(e.clientX, e.clientY); };\n    window.addEventListener('touchstart', onTouchStart, { passive: true });\n    window.addEventListener('touchmove', onTouchMove, { passive: true });\n    window.addEventListener('pointerdown', onPointerDown, { passive: true });\n    this._meterTouchOff = () => {\n      window.removeEventListener('touchstart', onTouchStart);\n      window.removeEventListener('touchmove', onTouchMove);\n      window.removeEventListener('pointerdown', onPointerDown);\n    };",
              "const onTouchMove = e => { const t = e.touches && e.touches[0]; if (t) placeTouchMeter(t.clientX, t.clientY); };\n    const onTouchEnd = () => { touchActive = false; touchAt = Date.now(); };\n    const onPointerDown = e => { if (e.pointerType === 'touch' || e.pointerType === 'pen') placeTouchMeter(e.clientX, e.clientY); };\n    window.addEventListener('touchstart', onTouchStart, { passive: true });\n    window.addEventListener('touchmove', onTouchMove, { passive: true });\n    window.addEventListener('touchend', onTouchEnd, { passive: true });\n    window.addEventListener('touchcancel', onTouchEnd, { passive: true });\n    window.addEventListener('pointerdown', onPointerDown, { passive: true });\n    this._meterTouchOff = () => {\n      window.removeEventListener('touchstart', onTouchStart);\n      window.removeEventListener('touchmove', onTouchMove);\n      window.removeEventListener('touchend', onTouchEnd);\n      window.removeEventListener('touchcancel', onTouchEnd);\n      window.removeEventListener('pointerdown', onPointerDown);\n    };",
              'touch end lifecycle'
          )

          one(
              "const inFold1 = fold1 && y >= fold1.offsetTop && y <= fold1.offsetTop + fold1.offsetHeight - vh + 4;\n        if (coarse) {\n          meter.style.opacity = (inFold1 && Date.now() - touchAt < 420) ? '1' : '0';\n        } else {\n          meter.style.opacity = (Date.now() - mAt < 900 && inFold1) ? '1' : '0';\n        }",
              "const inFold1 = fold1 && y >= fold1.offsetTop && y <= fold1.offsetTop + fold1.offsetHeight - vh + 4;\n        if (coarse) {\n          meter.style.opacity = (touchActive || Date.now() - touchAt < 180) ? '1' : '0';\n        } else {\n          meter.style.opacity = (Date.now() - mAt < 900 && inFold1) ? '1' : '0';\n        }",
              'touch meter visibility'
          )

          # 5) Preserve the enlarged 112px mobile route rail if present; fail if regressed.
          if "rail.style.width = '112px';" not in s:
              raise SystemExit('mobile route rail is not 112px')

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check

      - name: Commit final production fix
        run: |
          rm .github/workflows/final-mobile-production-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "RICC Site v2.dc.html" .github/workflows/final-mobile-production-fix.yml
          git commit -m "fix: finalize mobile hero transitions founder theme and touch cursor"
          git push origin HEAD:fix/production-mobile-final
