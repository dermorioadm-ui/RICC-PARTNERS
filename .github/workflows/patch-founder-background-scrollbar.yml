name: Patch founder background and mobile route width

on:
  push:
    branches:
      - fix/founder-background-scrollbar

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/founder-background-scrollbar
      - name: Apply requested visual fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('RICC Site v2.dc.html')
          s = p.read_text(encoding='utf-8')

          marker = '<section data-fold="35"'
          i = s.find(marker)
          if i == -1:
              raise SystemExit('Founder section not found.')
          j = s.find('>', i)
          tag = s[i:j+1]
          # Keep/restore the original dark page color; remove any light override if present.
          if 'background:#0E1114' not in tag:
              if re.search(r'background:#[0-9A-Fa-f]{6}', tag):
                  tag = re.sub(r'background:#[0-9A-Fa-f]{6}', 'background:#0E1114', tag, count=1)
              else:
                  tag = tag[:-1] + ';background:#0E1114>'
          if 'color:#F1F2EE' not in tag:
              if re.search(r'color:#[0-9A-Fa-f]{6}', tag):
                  tag = re.sub(r'color:#[0-9A-Fa-f]{6}', 'color:#F1F2EE', tag, count=1)
              else:
                  tag = tag[:-1] + ';color:#F1F2EE>'
          s = s[:i] + tag + s[j+1:]

          # Double the global mobile scroll-reference rail from 56px to 112px.
          if "rail.style.width = '56px';" not in s:
              raise SystemExit('Mobile HUD rail width not found.')
          s = s.replace("rail.style.width = '56px';", "rail.style.width = '112px';", 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit requested visual fixes only
        run: |
          rm .github/workflows/patch-founder-background-scrollbar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "RICC Site v2.dc.html" .github/workflows/patch-founder-background-scrollbar.yml
          git commit -m "fix: keep founder dark background and widen mobile scroll rail"
          git push origin HEAD:fix/founder-background-scrollbar
