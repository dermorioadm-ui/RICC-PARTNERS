name: Final no-overlap mobile hero

on:
  push:
    branches:
      - fix/mobile-no-overlap-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-no-overlap-final
      - name: Remove overlap and trim dead hero tail
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('RICC Site v2.dc.html')
          s = p.read_text(encoding='utf-8')

          old = '''    [data-st="b"]>div{gap:24px!important}\n  }'''
          new = '''    [data-st="b"]>div{gap:24px!important}\n    /* Mobile: normal document flow between hero and eligibility. */\n    .eligibility-scene{margin-top:0!important}\n  }'''
          if old not in s:
              raise SystemExit('mobile media anchor not found')
          s = s.replace(old, new, 1)

          old = "resp(document.querySelector('[data-fold=\"1\"]'), e => { e.style.height = '600svh'; });"
          new = "resp(document.querySelector('[data-fold=\"1\"]'), e => { e.style.height = '520svh'; });"
          if old not in s:
              raise SystemExit('mobile fold1 height not found')
          s = s.replace(old, new, 1)

          old = "const finale = smooth((p - 0.64) / 0.08);"
          new = "const finale = smooth((p - 0.84) / 0.06);"
          if old not in s:
              raise SystemExit('hero finale timing not found')
          s = s.replace(old, new, 1)

          old = "sB.style.opacity = smooth((p - 0.72) / 0.055).toFixed(3);\n          sB.style.transform = 'translate3d(0,' + ((1 - smooth((p - 0.72) / 0.055)) * 18 * motion).toFixed(1) + 'px,0)';"
          new = "sB.style.opacity = smooth((p - 0.90) / 0.045).toFixed(3);\n          sB.style.transform = 'translate3d(0,' + ((1 - smooth((p - 0.90) / 0.045)) * 18 * motion).toFixed(1) + 'px,0)';"
          if old not in s:
              raise SystemExit('final hero copy timing not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit isolated final mobile flow fix
        run: |
          rm .github/workflows/final-no-overlap-mobile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "RICC Site v2.dc.html" .github/workflows/final-no-overlap-mobile.yml
          git commit -m "fix: remove mobile fold overlap and dead hero tail"
          git push origin HEAD:fix/mobile-no-overlap-final
