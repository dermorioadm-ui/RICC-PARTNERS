name: Patch mobile scroll touch cursor

on:
  push:
    branches:
      - fix/mobile-scroll-touch-cursor

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-scroll-touch-cursor
      - name: Apply touch cursor patch
        run: python .github/patch_touch.py
      - name: Commit touch cursor fix
        run: |
          rm .github/patch_touch.py
          rm .github/workflows/patch-mobile-scroll-touch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "RICC Site v2.dc.html" .github/patch_touch.py .github/workflows/patch-mobile-scroll-touch.yml
          git commit -m "fix: make mobile scroll cursor follow touch"
          git push origin HEAD:fix/mobile-scroll-touch-cursor
